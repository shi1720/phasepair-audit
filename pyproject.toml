[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "phasepair"
version = "0.1.0"
description = "Paired slice-origin sensitivity audit for contour-derived volumetry"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2", "matplotlib>=3.7", "shapely>=2", "requests>=2"]
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
